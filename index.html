<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PAN PAN</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background-color: #FAF3E8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* 프라이팬 스테이지 */
  #stage {
    position: relative;
    width: min(92vw, 520px);
    height: min(92vw, 520px);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  /* 가스레인지 은은한 불빛 (굽는 중일 때 표시) */
  #burner-glow {
    position: absolute;
    width: 66%;
    height: 66%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 160, 50, 0.45) 0%, rgba(255, 110, 30, 0.15) 60%, transparent 75%);
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
    z-index: 0;
    animation: flamePulse 1.4s infinite alternate ease-in-out;
  }

  #burner-glow.active {
    opacity: 1;
  }

  @keyframes flamePulse {
    0% { transform: scale(0.97); opacity: 0.75; }
    100% { transform: scale(1.04); opacity: 1; }
  }

  /* 프라이팬 본체 및 손잡이 */
  .pan-handle {
    position: absolute;
    right: -14%;
    top: 50%;
    transform: translateY(-50%);
    width: 34%;
    height: 11%;
    background: linear-gradient(180deg, #5C4332 0%, #3E2B1E 50%, #2A1C13 100%);
    border-radius: 0 24px 24px 0;
    box-shadow: 0 10px 20px rgba(62, 43, 30, 0.25);
    z-index: 1;
  }

  .pan-handle::after {
    content: "";
    position: absolute;
    right: 14%;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: #FAF3E8;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }

  .pan-body {
    position: relative;
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4A4440 0%, #2E2926 70%, #1F1B19 100%);
    box-shadow:
      0 18px 36px rgba(62, 43, 30, 0.28),
      inset 0 4px 10px rgba(255, 255, 255, 0.12),
      inset 0 -8px 16px rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  .pan-inner {
    position: relative;
    width: 88%;
    height: 88%;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 45%, #3B3531 0%, #2B2623 85%, #221E1B 100%);
    box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.65);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* 구워지는 음식 캔버스 래퍼 */
  #food-wrapper {
    position: relative;
    width: 78%;
    height: 78%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 3;
    transition: transform 0.1s ease;
  }

  #food-wrapper.sizzling {
    animation: sizzleShake 0.28s infinite ease-in-out;
  }

  #food-wrapper.flipping {
    animation: flipFood 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes sizzleShake {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    25% { transform: translate(-1.2px, 0.8px) rotate(-0.5deg); }
    50% { transform: translate(1px, -0.8px) rotate(0.5deg); }
    75% { transform: translate(-0.8px, -0.6px) rotate(-0.3deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }

  @keyframes flipFood {
    0% { transform: scale(1) rotateX(0deg); }
    45% { transform: scale(1.22) translateY(-18px) rotateX(180deg); }
    100% { transform: scale(1) translateY(0px) rotateX(360deg); }
  }

  #pan-canvas {
    max-width: 100%;
    max-height: 100%;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
  }

  /* 김/열기 및 지글지글 파티클 */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
  }

  /* 올가미 자르기 오버레이 (사진 업로드 시에만 등장) */
  #lasso-overlay {
    position: fixed;
    inset: 0;
    background-color: rgba(45, 33, 24, 0.82);
    backdrop-filter: blur(6px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    touch-action: none;
  }

  #lasso-overlay.open {
    display: flex;
  }

  #lasso-canvas {
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    cursor: crosshair;
    touch-action: none;
  }

  /* 우측 하단 미니멀 다운로드 아이콘 (구워진 음식이 있을 때만 표시) */
  #download-btn {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background-color: #E8D5BE;
    color: #5C4332;
    font-size: 20px;
    font-weight: bold;
    display: none;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(92, 67, 50, 0.18);
    transition: transform 0.15s ease, background-color 0.2s ease;
    z-index: 20;
  }

  #download-btn.visible {
    display: flex;
  }

  #download-btn:hover {
    background-color: #DFC3A2;
    transform: translateY(-2px);
  }

  #file-input {
    display: none;
  }
</style>
</head>
<body>

  <div id="stage">
    <div id="burner-glow"></div>
    <div class="pan-handle"></div>
    <div class="pan-body">
      <div class="pan-inner">
        <div id="food-wrapper">
          <canvas id="pan-canvas"></canvas>
        </div>
        <canvas id="fx-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- 사진 업로드 후 바로 올가미로 자르는 화면 -->
  <div id="lasso-overlay">
    <canvas id="lasso-canvas"></canvas>
  </div>

  <!-- 결과 PNG 저장 미니 아이콘 -->
  <button id="download-btn" title="PNG 저장">↓</button>
  <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp, image/*">

<script>
  const stage = document.getElementById('stage');
  const burnerGlow = document.getElementById('burner-glow');
  const foodWrapper = document.getElementById('food-wrapper');
  const panCanvas = document.getElementById('pan-canvas');
  const panCtx = panCanvas.getContext('2d', { willReadFrequently: true });
  const fxCanvas = document.getElementById('fx-canvas');
  const fxCtx = fxCanvas.getContext('2d');

  const lassoOverlay = document.getElementById('lasso-overlay');
  const lassoCanvas = document.getElementById('lasso-canvas');
  const lassoCtx = lassoCanvas.getContext('2d');

  const fileInput = document.getElementById('file-input');
  const downloadBtn = document.getElementById('download-btn');

  // 상태 변수
  let loadedImage = null;
  let lassoPoints = [];
  let isDrawingLasso = false;

  let rawImageData = null;      // 오려낸 원본 픽셀 데이터
  let edgeDistanceMap = null;   // 가장자리 노릇함 계산용 거리 맵
  let cookLevel = 0;            // 0.0 ~ 1.0 (노릇노릇한 빵 색감 상한선)
  let isCooking = false;
  let cookTimer = null;
  let clickTimer = null;
  let particles = [];

  // 1. 프라이팬 클릭 / 드래그 앤 드롭으로 사진 업로드
  stage.addEventListener('click', (e) => {
    if (!rawImageData) {
      fileInput.click();
      return;
    }

    // 싱글 탭: 뒤집기 / 더블 탭: 팬 비우기
    if (clickTimer) {
      clearTimeout(clickTimer);
      clickTimer = null;
      resetPan();
    } else {
      clickTimer = setTimeout(() => {
        clickTimer = null;
        flipFood();
      }, 240);
    }
  });

  // 드래그 앤 드롭 지원
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleImageFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      handleImageFile(e.target.files[0]);
      fileInput.value = '';
    }
  });

  function handleImageFile(file) {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        openLassoEditor(img);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 2. 올가미 자르기 에디터 열기
  function openLassoEditor(img) {
    const maxW = window.innerWidth * 0.86;
    const maxH = window.innerHeight * 0.82;
    const scale = Math.min(maxW / img.width, maxH / img.height, 1);

    lassoCanvas.width = Math.round(img.width * scale);
    lassoCanvas.height = Math.round(img.height * scale);
    lassoPoints = [];
    isDrawingLasso = false;

    renderLassoView();
    lassoOverlay.classList.add('open');
  }

  function renderLassoView() {
    if (!loadedImage) return;
    const w = lassoCanvas.width;
    const h = lassoCanvas.height;

    lassoCtx.clearRect(0, 0, w, h);
    lassoCtx.drawImage(loadedImage, 0, 0, w, h);

    if (lassoPoints.length > 0) {
      // 선택 영역 외부를 어둡게 처리해 내부와 명확히 구분
      lassoCtx.save();
      lassoCtx.fillStyle = 'rgba(25, 18, 12, 0.48)';
      lassoCtx.beginPath();
      lassoCtx.rect(0, 0, w, h);
      lassoCtx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
      for (let i = 1; i < lassoPoints.length; i++) {
        lassoCtx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
      }
      lassoCtx.closePath();
      lassoCtx.fill('evenodd');
      lassoCtx.restore();

      // 올가미 점선 테두리
      lassoCtx.save();
      lassoCtx.strokeStyle = '#FFF7EA';
      lassoCtx.lineWidth = 3;
      lassoCtx.setLineDash([7, 5]);
      lassoCtx.lineCap = 'round';
      lassoCtx.lineJoin = 'round';
      lassoCtx.beginPath();
      lassoCtx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
      for (let i = 1; i < lassoPoints.length; i++) {
        lassoCtx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
      }
      if (!isDrawingLasso) lassoCtx.closePath();
      lassoCtx.stroke();
      lassoCtx.restore();
    }
  }

  function getPointerPos(e) {
    const rect = lassoCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: Math.max(0, Math.min(lassoCanvas.width, clientX - rect.left)),
      y: Math.max(0, Math.min(lassoCanvas.height, clientY - rect.top))
    };
  }

  function startLasso(e) {
    e.preventDefault();
    isDrawingLasso = true;
    lassoPoints = [getPointerPos(e)];
    renderLassoView();
  }

  function moveLasso(e) {
    if (!isDrawingLasso) return;
    e.preventDefault();
    const pos = getPointerPos(e);
    const last = lassoPoints[lassoPoints.length - 1];
    if (Math.hypot(pos.x - last.x, pos.y - last.y) > 3) {
      lassoPoints.push(pos);
      renderLassoView();
    }
  }

  function endLasso(e) {
    if (!isDrawingLasso) return;
    e.preventDefault();
    isDrawingLasso = false;

    if (lassoPoints.length < 6) {
      lassoPoints = [];
      renderLassoView();
      return;
    }

    renderLassoView();
    setTimeout(() => {
      extractCutoutToPan();
      lassoOverlay.classList.remove('open');
    }, 140);
  }

  lassoCanvas.addEventListener('mousedown', startLasso);
  lassoCanvas.addEventListener('mousemove', moveLasso);
  window.addEventListener('mouseup', endLasso);

  lassoCanvas.addEventListener('touchstart', startLasso, { passive: false });
  lassoCanvas.addEventListener('touchmove', moveLasso, { passive: false });
  window.addEventListener('touchend', endLasso);

  // 3. 불규칙한 올가미 영역 실제 픽셀 오려내기 (외부는 완전 투명)
  function extractCutoutToPan() {
    const scaleX = loadedImage.width / lassoCanvas.width;
    const scaleY = loadedImage.height / lassoCanvas.height;

    const origPoints = lassoPoints.map(p => ({
      x: p.x * scaleX,
      y: p.y * scaleY
    }));

    let minX = loadedImage.width, minY = loadedImage.height, maxX = 0, maxY = 0;
    origPoints.forEach(p => {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    });

    minX = Math.max(0, Math.floor(minX));
    minY = Math.max(0, Math.floor(minY));
    maxX = Math.min(loadedImage.width, Math.ceil(maxX));
    maxY = Math.min(loadedImage.height, Math.ceil(maxY));

    const cropW = Math.max(1, maxX - minX);
    const cropH = Math.max(1, maxY - minY);

    // 작업 해상도 최적화 (선명도 유지 + 빠른 실시간 픽셀 연산)
    const maxDim = 340;
    const fitScale = Math.min(maxDim / cropW, maxDim / cropH, 1);
    const finalW = Math.max(1, Math.round(cropW * fitScale));
    const finalH = Math.max(1, Math.round(cropH * fitScale));

    panCanvas.width = finalW;
    panCanvas.height = finalH;

    panCtx.clearRect(0, 0, finalW, finalH);
    panCtx.save();
    panCtx.beginPath();
    origPoints.forEach((p, idx) => {
      const fx = (p.x - minX) * fitScale;
      const fy = (p.y - minY) * fitScale;
      if (idx === 0) panCtx.moveTo(fx, fy);
      else panCtx.lineTo(fx, fy);
    });
    panCtx.closePath();
    panCtx.clip();

    panCtx.drawImage(
      loadedImage,
      minX, minY, cropW, cropH,
      0, 0, finalW, finalH
    );
    panCtx.restore();

    rawImageData = panCtx.getImageData(0, 0, finalW, finalH);
    edgeDistanceMap = computeEdgeGlowMap(rawImageData);

    startAutoBaking();
  }

  // 가장자리가 빵 테두리처럼 조금 더 노릇하게 익도록 외곽 거리 맵 생성
  function computeEdgeGlowMap(imgData) {
    const w = imgData.width;
    const h = imgData.height;
    const data = imgData.data;
    const map = new Float32Array(w * h);

    // 알파 경계 탐색
    const borderDist = new Float32Array(w * h).fill(999);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = y * w + x;
        if (data[idx * 4 + 3] === 0) {
          borderDist[idx] = 0;
        } else if (x === 0 || y === 0 || x === w - 1 || y === h - 1) {
          borderDist[idx] = 1;
        }
      }
    }

    // 2-pass 근사 거리 변환
    for (let y = 1; y < h; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        if (borderDist[idx] > 0) {
          borderDist[idx] = Math.min(
            borderDist[idx],
            borderDist[idx - 1] + 1,
            borderDist[idx - w] + 1,
            borderDist[idx - w - 1] + 1.4,
            borderDist[idx - w + 1] + 1.4
          );
        }
      }
    }
    for (let y = h - 2; y >= 0; y--) {
      for (let x = w - 2; x >= 1; x--) {
        const idx = y * w + x;
        if (borderDist[idx] > 0) {
          borderDist[idx] = Math.min(
            borderDist[idx],
            borderDist[idx + 1] + 1,
            borderDist[idx + w] + 1,
            borderDist[idx + w + 1] + 1.4,
            borderDist[idx + w - 1] + 1.4
          );
        }
      }
    }

    const rimThickness = Math.max(10, Math.min(w, h) * 0.12);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = y * w + x;
        // 유기적인 노이즈를 살짝 섞어 자연스러운 빵 굽기 질감 생성
        const organicWave = (Math.sin(x * 0.14) * Math.cos(y * 0.14) + 1) * 0.5;
        const edgeFactor = Math.max(0, 1 - borderDist[idx] / rimThickness);
        map[idx] = Math.min(1, edgeFactor * 0.75 + organicWave * 0.25);
      }
    }
    return map;
  }

  // 4. 빵처럼 노릇노릇하게 구워지는 실시간 RGB 픽셀 변환
  function startAutoBaking() {
    if (cookTimer) clearInterval(cookTimer);
    cookLevel = 0.05;
    isCooking = true;

    burnerGlow.classList.add('active');
    foodWrapper.classList.add('sizzling');
    downloadBtn.classList.add('visible');

    applyGoldenBreadToast(cookLevel);

    cookTimer = setInterval(() => {
      if (!isCooking) return;
      // 최대치(1.0)까지만 익고 검게 타지 않음
      if (cookLevel < 1.0) {
        cookLevel = Math.min(1.0, cookLevel + 0.018);
        applyGoldenBreadToast(cookLevel);
      } else {
        // 다 구워지면 잔열만 남기고 흔들림 진정
        foodWrapper.classList.remove('sizzling');
      }
    }, 110);
  }

  function applyGoldenBreadToast(level) {
    if (!rawImageData) return;
    const w = rawImageData.width;
    const h = rawImageData.height;
    const src = rawImageData.data;
    const out = panCtx.createImageData(w, h);
    const dst = out.data;

    // 갓 구운 식빵/팬케이크의 따뜻한 황금빛 갈색 목표 톤 (R:212, G:136, B:54)
    const toastR = 212;
    const toastG = 136;
    const toastB = 54;

    // 가장자리 크러스트(식빵 테두리) 톤 (R:168, G:94, B:34)
    const crustR = 168;
    const crustG = 94;
    const crustB = 34;

    for (let i = 0, p = 0; i < src.length; i += 4, p++) {
      const a = src[i + 3];
      if (a === 0) {
        dst[i + 3] = 0;
        continue;
      }

      const r = src[i];
      const g = src[i + 1];
      const b = src[i + 2];

      const edgeWeight = edgeDistanceMap ? edgeDistanceMap[p] : 0;
      const localBake = Math.min(1.0, level * (0.68 + edgeWeight * 0.42));

      // 픽셀 밝기(Luminance)를 반영하여 명암 입체감 유지
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const shade = 0.72 + lum * 0.42;

      const targetR = (toastR * (1 - edgeWeight * 0.55) + crustR * (edgeWeight * 0.55)) * shade;
      const targetG = (toastG * (1 - edgeWeight * 0.55) + crustG * (edgeWeight * 0.55)) * shade;
      const targetB = (toastB * (1 - edgeWeight * 0.55) + crustB * (edgeWeight * 0.55)) * shade;

      // 원본 색상과 따뜻한 골든 브라운 색상을 부드럽게 블렌딩 + 따뜻한 온기 가산
      const blend = localBake * 0.62;
      const warmBoostR = localBake * 16;
      const warmBoostG = localBake * 6;
      const warmDropB = localBake * 14;

      dst[i]     = Math.min(255, Math.max(0, r * (1 - blend) + targetR * blend + warmBoostR));
      dst[i + 1] = Math.min(255, Math.max(0, g * (1 - blend) + targetG * blend + warmBoostG));
      dst[i + 2] = Math.min(255, Math.max(0, b * (1 - blend) + targetB * blend - warmDropB));
      dst[i + 3] = a; // 투명도 그대로 유지
    }

    panCtx.putImageData(out, 0, 0);
  }

  // 5. 뒤집기 애니메이션 및 지글지글 스파크 효과
  function flipFood() {
    if (!rawImageData) return;
    foodWrapper.classList.remove('flipping');
    void foodWrapper.offsetWidth;
    foodWrapper.classList.add('flipping');

    // 뒤집을 때 노릇함이 살짝 더해짐
    cookLevel = Math.min(1.0, cookLevel + 0.12);
    applyGoldenBreadToast(cookLevel);

    // 지글지글 황금 기름방울 스파크 생성
    for (let i = 0; i < 14; i++) {
      particles.push({
        x: fxCanvas.width * (0.3 + Math.random() * 0.4),
        y: fxCanvas.height * (0.3 + Math.random() * 0.4),
        vx: (Math.random() - 0.5) * 3.2,
        vy: -1 - Math.random() * 2.5,
        size: 2 + Math.random() * 3,
        alpha: 0.9,
        type: 'spark'
      });
    }
  }

  function resetPan() {
    isCooking = false;
    if (cookTimer) clearInterval(cookTimer);
    rawImageData = null;
    cookLevel = 0;
    panCtx.clearRect(0, 0, panCanvas.width, panCanvas.height);
    burnerGlow.classList.remove('active');
    foodWrapper.classList.remove('sizzling', 'flipping');
    downloadBtn.classList.remove('visible');
  }

  // 6. 김(Steam) & 지글지글 파티클 루프
  function resizeFxCanvas() {
    const rect = fxCanvas.parentElement.getBoundingClientRect();
    fxCanvas.width = rect.width;
    fxCanvas.height = rect.height;
  }
  window.addEventListener('resize', resizeFxCanvas);
  resizeFxCanvas();

  function animateFx() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

    if (isCooking && Math.random() < 0.25) {
      particles.push({
        x: fxCanvas.width * (0.28 + Math.random() * 0.44),
        y: fxCanvas.height * (0.35 + Math.random() * 0.35),
        vx: (Math.random() - 0.5) * 0.6,
        vy: -0.7 - Math.random() * 0.9,
        size: 8 + Math.random() * 14,
        alpha: 0.32,
        type: 'steam'
      });
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;

      if (p.type === 'steam') {
        p.size += 0.25;
        p.alpha -= 0.005;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.fillStyle = `rgba(255, 248, 235, ${p.alpha})`;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      } else {
        p.alpha -= 0.035;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.fillStyle = `rgba(255, 210, 105, ${p.alpha})`;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      }
    }

    requestAnimationFrame(animateFx);
  }
  animateFx();

  // 7. 투명 배경 + 구워진 픽셀 그대로 PNG 다운로드
  downloadBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!rawImageData) return;
    const link = document.createElement('a');
    link.download = 'pan-pan-toast.png';
    link.href = panCanvas.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
